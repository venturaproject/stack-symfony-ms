# See security-headers.prod.conf's comment — same inheritance footgun applies
# here. No HSTS in dev: it would "stick" in the browser for its max-age and
# force HTTPS on localhost long after this container is gone.
add_header X-Frame-Options         "DENY"                              always;
add_header X-Content-Type-Options  "nosniff"                           always;
add_header X-XSS-Protection        "1; mode=block"                     always;
add_header Referrer-Policy         "strict-origin-when-cross-origin"   always;
add_header Permissions-Policy      "camera=(), microphone=(), geolocation=()" always;
# script-src/style-src carve-out for cdn.jsdelivr.net: nelmio/api-doc-bundle's
# Swagger UI at /api/doc loads its JS/CSS from there by default (assets_mode:
# cdn). Self-hosting instead would need the gateway to serve /bundles/* as static
# files, which it deliberately doesn't do anywhere else — narrower to allowlist
# the one known origin than to add general static-file serving to an API gateway.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' cdn.jsdelivr.net; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
