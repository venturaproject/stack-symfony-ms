# Single origin for every service — the browser only ever talks to this gateway,
# so cookies (access_token, XSRF-TOKEN) and CSRF stay same-origin across the whole
# topology without any CORS configuration, exactly like the monolith's nginx.
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

server {
    listen 80;

    # Docker's embedded DNS. Without this, fastcgi_pass with a plain hostname
    # resolves once when nginx's worker processes start and holds that IP for
    # their whole lifetime — restart identity/notification individually (not the
    # gateway) enough times during a dev session and their container IPs can
    # drift out from under a long-running gateway, silently routing traffic to
    # whichever service now holds the stale IP. A variable in fastcgi_pass forces
    # nginx to re-resolve through this resolver instead of caching indefinitely.
    resolver 127.0.0.11 valid=10s;

    include /etc/nginx/snippets/security-headers.dev.conf;

    # Most specific /api/ prefix wins in nginx's location matching, so this is
    # evaluated before the catch-all /api/ block below routes to identity.
    location /api/notifications {
        limit_req zone=api burst=40 nodelay;
        limit_req_status 429;
        set $notification_upstream notification;
        fastcgi_pass $notification_upstream:9000;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param DOCUMENT_ROOT /app/public;
        include fastcgi_params;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_read_timeout 60;
        client_max_body_size 10M;
    }

    # Deliberately not routed: Symfony's web debug toolbar/profiler (/_wdt,
    # /_profiler). They're dev-only in bundles.php, but nginx has no reliable way
    # to tell "request from the host operator" apart from "request from anyone who
    # can reach the published gateway port" through Docker's NAT — allowlisting by
    # source IP doesn't hold up there. This boilerplate is verified via curl, not a
    # browser, so the toolbar has no consumer here; the safe default is to leave it
    # unroutable through the gateway rather than exposing full stack traces, SQL
    # with bound values, and request/response headers (incl. cookies) to anyone on
    # the network. Reach it directly against a service's own port if you need it.
    # See docs/SECURITY-REVIEW.md — this was accidentally reintroduced once already
    # by a concurrent edit; if you're re-adding it, re-read that doc first.

    # Everything else under /api/ — auth, users, roles, permissions, api-clients,
    # security-settings, totp, health — belongs to Identity today. As Catalog/
    # Customer/Order are added (Phase 2), they get their own location blocks here.
    location /api/ {
        limit_req zone=api burst=40 nodelay;
        limit_req_status 429;
        set $identity_upstream identity;
        fastcgi_pass $identity_upstream:9000;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param DOCUMENT_ROOT /app/public;
        include fastcgi_params;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_read_timeout 60;
        client_max_body_size 10M;
    }
}
