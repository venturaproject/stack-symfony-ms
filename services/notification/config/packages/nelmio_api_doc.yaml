nelmio_api_doc:
    documentation:
        info:
            title: Notification Service API
            description: In-app notifications (list, mark read, delete).
            version: 1.0.0
        components:
            securitySchemes:
                bearerAuth:
                    type: http
                    scheme: bearer
                    bearerFormat: JWT
        security:
            - bearerAuth: []
    areas:
        default:
            path_patterns:
                - ^/api/notifications
